[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "recall-meetings"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "sqlalchemy>=2.0", "alembic>=1.13", "pydantic>=2.6", "psycopg[binary]>=3.1", "python-multipart>=0.0.9", "httpx>=0.27", "python-docx>=1.1", "pypdf>=4", "rapidfuzz>=3.6", "dateparser>=1.2", "rank-bm25>=0.2.2", "python-dotenv>=1.0"]
[project.optional-dependencies]
nlp = ["spacy>=3.7", "sentence-transformers>=2.6", "keybert>=0.8", "faiss-cpu>=1.8", "transformers>=4.39", "torch>=2.2"]
test = ["pytest>=8", "httpx>=0.27"]
[tool.setuptools.packages.find]
where = ["."]
